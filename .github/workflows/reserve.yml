name: IIC Restaurant 자동 예약 매크로

on:
  schedule:
    - cron: '1 23 * * 0-4'
  workflow_dispatch:

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: Playwright Chromium 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: 예약 매크로 실행
        run: node macro.js

      - name: 결과 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 예약결과-${{ github.run_id }}
          path: |
            result_*.png
            error_*.png
          retention-days: 7
          if-no-files-found: ignore
